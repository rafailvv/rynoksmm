server {
    listen 80;
    server_name smm.prof-tg.ru massage.prof-tg.ru photo.prof-tg.ru prof-tg.ru s3.prof-tg.ru console.s3.prof-tg.ru grafana.smm.prof-tg.ru grafana.massage.prof-tg.ru grafana.photo.prof-tg.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smm.prof-tg.ru;

    ssl_certificate /etc/letsencrypt/live/smm.prof-tg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smm.prof-tg.ru/privkey.pem;

    client_max_body_size 100M;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        proxy_pass http://web_smm:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Ssl   on;
        
        # Отключение кеша
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

