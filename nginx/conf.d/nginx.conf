server {
    listen 443 ssl;
    server_name s3.prof-tg.ru;

    ssl_certificate /etc/letsencrypt/live/s3.prof-tg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.prof-tg.ru/privkey.pem;

    client_max_body_size 500M;
    proxy_request_buffering off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Ssl   on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name console.s3.prof-tg.ru;

    ssl_certificate /etc/letsencrypt/live/console.s3.prof-tg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.s3.prof-tg.ru/privkey.pem;

    client_max_body_size 500M;
    proxy_request_buffering off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Ssl   on;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}

