server {
    listen 80;
    server_name smm.prof-tg.ru massage.prof-tg.ru prof-tg.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name smm.prof-tg.ru;

    ssl_certificate /etc/letsencrypt/live/smm.prof-tg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smm.prof-tg.ru/privkey.pem;

    location / {
        proxy_pass http://web_smm:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name massage.prof-tg.ru;

    ssl_certificate /etc/letsencrypt/live/massage.prof-tg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massage.prof-tg.ru/privkey.pem;

    location / {
        proxy_pass http://web_massage:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name prof-tg.ru;

    ssl_certificate /etc/letsencrypt/live/prof-tg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prof-tg.ru/privkey.pem;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
