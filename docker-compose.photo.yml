networks:
  mynetwork:
    name: prof-tg-network

services:
  bot_photo:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - photo.env
    depends_on:
      - redis_photo
      - db_photo
    networks:
      - mynetwork

  web_photo:
    container_name: web_photo
    build:
      context: .
      dockerfile: Dockerfile.web
    command: sh -c "pytest tests/test_backend.py && uvicorn Backend:app --host 0.0.0.0 --port 8002 --reload --proxy-headers"
    ports:
      - "8002:8002"
    env_file:
      - photo.env
    depends_on:
      - redis_photo
      - db_photo
    volumes:
      - pg_data_photo:/var/lib/postgresql/data
    networks:
      - mynetwork

  redis_photo:
    image: "redis:latest"
    ports:
      - "6482:6379"
    networks:
      - mynetwork

  db_photo:
    image: "postgres:latest"
    environment:
      POSTGRES_USER: rynokphoto
      POSTGRES_PASSWORD: 23jQ29155skR9659
      POSTGRES_DB: rynokphoto
    ports:
      - "5435:5432"
    volumes:
      - pg_data_photo:/var/lib/postgresql/data
    networks:
      - mynetwork

  grafana_photo:
    image: grafana/grafana:latest
    container_name: grafana_photo
    environment:
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
    ports:
      - "3002:3002"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - mynetwork

volumes:
  pg_data_photo:
  grafana_data:
